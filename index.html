<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kumar S | Executive BIM Portfolio & CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            execBg: '#F5F3EF',
            execSurface: '#FFFFFF',
            execText: '#1D1D1B',
            execSecondary: '#6B6B65',
            execAccent: '#B08D57',
            execBorder: '#E2DDD5',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #EFECE6; }
    ::-webkit-scrollbar-thumb { background: #C8C2B8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #B08D57; }

    /* Architectural CAD Grid in Warm Stone & Gold */
    .exec-blueprint-grid {
      background-color: #F5F3EF;
      background-image:
        linear-gradient(rgba(176, 141, 87, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(176, 141, 87, 0.14) 1px, transparent 1px),
        linear-gradient(rgba(29, 29, 27, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 29, 27, 0.04) 1px, transparent 1px);
      background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    }

    .exec-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .exec-card:hover {
      transform: translateY(-3px);
      border-color: #B08D57;
      box-shadow: 0 14px 32px -12px rgba(29, 29, 27, 0.12);
    }

    @media print {
      body * { visibility: hidden; }
      #cv-print-sheet, #cv-print-sheet * { visibility: visible; }
      #cv-print-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        box-shadow: none !important;
        margin: 0 !important;
        border: none !important;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-execBg text-execText font-sans antialiased selection:bg-execAccent selection:text-white overflow-hidden h-screen flex flex-col">

  <!-- TOP COMMAND BAR (ONLY IN SPLIT EDITOR MODE) -->
  <header id="top-bar" class="no-print h-14 border-b border-execBorder bg-white/95 backdrop-blur px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded bg-execText flex items-center justify-center font-mono font-semibold text-execAccent text-xs border border-execAccent/40">
        KS
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-sm tracking-tight text-execText">Kumar S — Executive Portfolio Studio</span>
          <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-execBg text-execAccent border border-execAccent/30">MEP • LOD 200–500</span>
        </div>
      </div>
    </div>

    <!-- Mode Switcher -->
    <div class="flex items-center gap-1 bg-execBg p-1 rounded border border-execBorder">
      <button onclick="setAppMode('split')" id="btn-mode-split" class="px-3 py-1 rounded text-xs font-medium transition bg-execText text-white">
        1. Split Editor
      </button>
      <button onclick="setAppMode('public')" id="btn-mode-public" class="px-3 py-1 rounded text-xs font-medium transition text-execSecondary hover:text-execText">
        2. Public Share View
      </button>
    </div>

    <!-- Template Selector & Export -->
    <div class="flex items-center gap-2">
      <div class="flex items-center bg-execBg rounded border border-execBorder p-1 text-xs">
        <button onclick="setTemplate('3d-showcase')" id="tpl-3d-showcase" class="px-2.5 py-1 rounded bg-white text-execText shadow-sm font-medium transition">Executive 3D</button>
        <button onclick="setTemplate('blueprint')" id="tpl-blueprint" class="px-2.5 py-1 rounded text-execSecondary hover:text-execText transition">Technical Dossier</button>
        <button onclick="setTemplate('ats-print')" id="tpl-ats-print" class="px-2.5 py-1 rounded text-execSecondary hover:text-execText transition">A4 Print CV</button>
      </div>

      <button onclick="copyShareLink()" class="px-3 py-1.5 rounded text-xs font-mono bg-execBg hover:bg-execBorder/60 text-execText border border-execBorder transition">
        Copy Share URL
      </button>
      <button onclick="downloadJSON()" class="px-3 py-1.5 rounded text-xs font-mono bg-execAccent text-white hover:opacity-90 transition">
        Export resume.json
      </button>
    </div>
  </header>

  <!-- FLOATING PILL IN PUBLIC VIEW -->
  <div id="public-floating-pill" class="no-print hidden fixed bottom-5 right-5 z-50 flex items-center gap-2 bg-white/95 backdrop-blur-md border border-execBorder px-3.5 py-2 rounded-full shadow-xl">
    <span class="text-[11px] font-mono uppercase text-execSecondary">View:</span>
    <button onclick="setTemplate('3d-showcase')" class="text-xs px-2 py-0.5 rounded hover:bg-execBg text-execText font-mono font-medium">Executive 3D</button>
    <button onclick="setTemplate('blueprint')" class="text-xs px-2 py-0.5 rounded hover:bg-execBg text-execText font-mono font-medium">Dossier</button>
    <button onclick="setTemplate('ats-print')" class="text-xs px-2 py-0.5 rounded hover:bg-execBg text-execAccent font-mono font-semibold">A4 Print CV</button>
    <div class="h-3 w-[1px] bg-execBorder"></div>
    <button onclick="setAppMode('split')" class="text-xs text-white font-medium px-2.5 py-0.5 bg-execText rounded-full">Editor</button>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- LEFT PANE: MASTER DATA EDITOR -->
    <aside id="editor-pane" class="no-print w-full md:w-[440px] lg:w-[480px] border-r border-execBorder bg-[#EFECE6] flex flex-col shrink-0 h-full overflow-hidden">
      <!-- Editor Tabs -->
      <div class="flex border-b border-execBorder bg-white/70 px-2 pt-2 gap-1 text-xs font-medium overflow-x-auto shrink-0">
        <button onclick="setEditorTab('profile')" id="etab-profile" class="px-3 py-2 rounded-t border-b-2 border-execAccent text-execText font-semibold bg-[#EFECE6]">Profile & Photo</button>
        <button onclick="setEditorTab('experience')" id="etab-experience" class="px-3 py-2 rounded-t border-b-2 border-transparent text-execSecondary hover:text-execText">Experience</button>
        <button onclick="setEditorTab('projects')" id="etab-projects" class="px-3 py-2 rounded-t border-b-2 border-transparent text-execSecondary hover:text-execText">BIM Projects</button>
        <button onclick="setEditorTab('skills')" id="etab-skills" class="px-3 py-2 rounded-t border-b-2 border-transparent text-execSecondary hover:text-execText">Skills & Awards</button>
        <button onclick="setEditorTab('raw')" id="etab-raw" class="px-3 py-2 rounded-t border-b-2 border-transparent text-execSecondary hover:text-execText font-mono">JSON</button>
      </div>

      <!-- Editor Form Content -->
      <div id="editor-content" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>

      <!-- Editor Footer -->
      <div class="p-3 border-t border-execBorder bg-white flex items-center justify-between text-xs text-execSecondary shrink-0">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-execAccent"></span>
          <span>Saved in browser • Export JSON for GitHub</span>
        </span>
        <button onclick="resetToDefault()" class="text-execSecondary hover:text-execText underline">Reset Data</button>
      </div>
    </aside>

    <!-- RIGHT PANE: LIVE PORTFOLIO VIEWPORT -->
    <main id="preview-pane" class="flex-1 h-full overflow-y-auto relative bg-execBg">
      <div id="portfolio-mount" class="min-h-full w-full"></div>
    </main>

  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden bg-execText text-white font-medium px-4 py-2 rounded-full shadow-lg text-xs font-mono border border-execAccent"></div>

  <script>
    // =========================================================================

    // =========================================================================
    const DEFAULT_RESUME_DATA = {

          items: ["Revit MEP (HVAC, Plumbing, Fire, Electrical)", "Parametric Family Creation", "LOD 200–500", "Scan-to-BIM", "Shop Drawings & RFIs"]
        },
        {

          level: 90,
          items: ["Dynamo Scripting", "AutoLISP Automation", "Parameter Standardization", "QA/QC Process Optimization"]
        },
        {
          category: "Mechanical & CAD Tools",
          level: 88,
          items: ["AutoCAD", "Creo", "CATIA", "SolidWorks", "Telecom Infrastructure Drafting"]
        }
      ],
      education: [
        {
          degree: "Bachelor of Engineering (B.E) - Mechanical Engineering",
          institution: "T.J.S Engineering College, Chennai, India",
          year: "2013 – 2017"
        }
      ],
      awardsAndCerts: [
        "Certificate: Revizto Expert Level 3 Certification",
        "Certificate: Master Diploma in CADD",
        "Award (2025): The Shining Star (Apr–Sep 2025), Illumine Industries Pvt Ltd — Innovation in process automation (LISP/Dynamo) & team collaboration",
        "Award (2024): The Shining Star (Apr–Sep 2024), Illumine Industries Pvt Ltd — Exceptional quality in deliverables & team coordination",
        "Award (2019): Shining Star (2018–2019), ASE Structure Design Pvt Ltd — High-quality outputs, on-time delivery & high productivity"
      ]
    };

    // =========================================================================
    // 2. STATE & URL MANAGEMENT
    // =========================================================================
    const STORAGE_KEY = 'kumar_bim_exec_portfolio_v2';
    let state = JSON.parse(JSON.stringify(DEFAULT_RESUME_DATA));
    let currentEditorTab = 'profile';
    let currentTemplate = '3d-showcase';
    let appMode = 'split';
    let threeCleanup = null;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderPreview();
    }

    function resetToDefault() {
      if (confirm('Reset all portfolio data back to Kumar S original resume?')) {
        state = JSON.parse(JSON.stringify(DEFAULT_RESUME_DATA));
        saveState();
        renderEditor();
        showToast('Restored original resume data');
      }
    }

    function applyUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const tpl = params.get('template');
      const view = params.get('view');
      if (tpl && ['3d-showcase', 'blueprint', 'ats-print'].includes(tpl)) {
        currentTemplate = tpl;
      }
      if (view === 'public') {
        appMode = 'public';
      }
    }

    function setAppMode(mode) {
      appMode = mode;
      const editorPane = document.getElementById('editor-pane');
      const topBar = document.getElementById('top-bar');
      const pill = document.getElementById('public-floating-pill');

      if (mode === 'public') {
        editorPane.classList.add('hidden');
        topBar.classList.add('hidden');
        pill.classList.remove('hidden');
      } else {
        editorPane.classList.remove('hidden');
        topBar.classList.remove('hidden');
        pill.classList.add('hidden');
      }
      setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
    }

    function setTemplate(tpl) {
      currentTemplate = tpl;
      ['3d-showcase', 'blueprint', 'ats-print'].forEach(id => {
        const btn = document.getElementById('tpl-' + id);
        if (!btn) return;
        if (id === tpl) {
          btn.className = "px-2.5 py-1 rounded bg-white text-execText shadow-sm font-medium transition";
        } else {
          btn.className = "px-2.5 py-1 rounded text-execSecondary hover:text-execText transition";
        }
      });
      renderPreview();
    }

    function setEditorTab(tab) {
      currentEditorTab = tab;
      ['profile', 'experience', 'projects', 'skills', 'raw'].forEach(t => {
        const el = document.getElementById('etab-' + t);
        if (t === tab) {
          el.className = "px-3 py-2 rounded-t border-b-2 border-execAccent text-execText font-semibold bg-[#EFECE6]";
        } else {
          el.className = "px-3 py-2 rounded-t border-b-2 border-transparent text-execSecondary hover:text-execText";
        }
      });
      renderEditor();
    }

    // =========================================================================
    // 3. LEFT PANE EDITOR RENDERER
    // =========================================================================
    function renderEditor() {
      const container = document.getElementById('editor-content');
      if (!container) return;

      if (currentEditorTab === 'profile') {
        const p = state.profile;
        container.innerHTML = `
          <div class="space-y-3">
            <div class="p-3 rounded bg-white border border-execBorder text-xs text-execSecondary">
              <strong class="text-execText">Adding Images Later:</strong> Leave the Photo URL blank for a clean executive monogram, or paste an image path (e.g., <code class="text-execAccent">./images/kumar.jpg</code>) anytime in the future.
            </div>
            ${editorInput('Full Name', p.name, 'profile.name')}
            ${editorInput('Title / Headline', p.title, 'profile.title')}
            ${editorInput('Profile Photo URL / Path (Optional — Add Later)', p.avatar || '', 'profile.avatar', 'e.g., ./images/profile.jpg or https://...')}
            ${editorInput('Technical Tagline', p.tagline, 'profile.tagline')}
            <div class="grid grid-cols-2 gap-2">
              ${editorInput('Email', p.email, 'profile.email')}
              ${editorInput('Phone', p.phone, 'profile.phone')}
            </div>
            <div class="grid grid-cols-2 gap-2">
              ${editorInput('Location', p.location, 'profile.location')}
              ${editorInput('LinkedIn', p.linkedin, 'profile.linkedin')}
            </div>
            ${editorInput('Top Certification Badge', p.website, 'profile.website')}
            <div>
              <label class="block text-[11px] font-mono uppercase text-execSecondary mb-1">Executive Summary</label>
              <textarea oninput="updateField('profile.summary', this.value)" rows="4" class="w-full bg-white border border-execBorder rounded p-2.5 text-xs text-execText focus:border-execAccent focus:outline-none">${escapeHtml(p.summary)}</textarea>
            </div>
          </div>
        `;
      } else if (currentEditorTab === 'experience') {
        container.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-execSecondary">Check/uncheck roles to tailor your shared CV.</span>
            <button onclick="addExperience()" class="px-2.5 py-1 bg-execText text-white font-medium rounded text-xs">+ Add Role</button>
          </div>
          <div class="space-y-4">
            ${state.experience.map((exp, idx) => `
              <div class="p-3 rounded border ${exp.included ? 'border-execBorder bg-white' : 'border-execBorder/50 bg-white/40 opacity-60'} space-y-2.5">
                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" ${exp.included ? 'checked' : ''} onchange="toggleExp(${idx}, this.checked)" class="rounded accent-[#B08D57] w-4 h-4" />
                    <span class="text-xs font-mono ${exp.included ? 'text-execAccent font-semibold' : 'text-execSecondary'}">${exp.included ? 'INCLUDED IN CV' : 'HIDDEN'}</span>
                  </label>
                  <button onclick="removeExp(${idx})" class="text-xs text-execSecondary hover:text-red-600">Delete</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <input value="${escapeAttr(exp.role)}" oninput="updateExp(${idx}, 'role', this.value)" placeholder="Role" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execText" />
                  <input value="${escapeAttr(exp.company)}" oninput="updateExp(${idx}, 'company', this.value)" placeholder="Company" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execText" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <input value="${escapeAttr(exp.period)}" oninput="updateExp(${idx}, 'period', this.value)" placeholder="Period" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execSecondary font-mono" />
                  <input value="${escapeAttr(exp.metrics)}" oninput="updateExp(${idx}, 'metrics', this.value)" placeholder="Key Scope" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execAccent font-mono" />
                </div>
                <div>
                  <label class="block text-[10px] font-mono uppercase text-execSecondary mb-1">Highlights (One per line)</label>
                  <textarea oninput="updateExpHighlights(${idx}, this.value)" rows="4" class="w-full bg-execBg border border-execBorder rounded p-2 text-xs text-execText">${escapeHtml(exp.highlights.join('\n'))}</textarea>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentEditorTab === 'projects') {
        container.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-execSecondary">Add project render images anytime later via URL or folder path.</span>
            <button onclick="addProject()" class="px-2.5 py-1 bg-execText text-white font-medium rounded text-xs">+ Add Project</button>
          </div>
          <div class="space-y-4">
            ${state.projects.map((proj, idx) => `
              <div class="p-3 rounded border ${proj.included ? 'border-execBorder bg-white' : 'border-execBorder/50 bg-white/40 opacity-60'} space-y-2.5">
                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" ${proj.included ? 'checked' : ''} onchange="toggleProj(${idx}, this.checked)" class="rounded accent-[#B08D57] w-4 h-4" />
                    <span class="text-xs font-mono ${proj.included ? 'text-execAccent font-semibold' : 'text-execSecondary'}">${proj.included ? 'VISIBLE' : 'HIDDEN'}</span>
                  </label>
                  <button onclick="removeProj(${idx})" class="text-xs text-execSecondary hover:text-red-600">Delete</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <input value="${escapeAttr(proj.name)}" oninput="updateProj(${idx}, 'name', this.value)" placeholder="Project Name" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execText font-semibold" />
                  <input value="${escapeAttr(proj.metric)}" oninput="updateProj(${idx}, 'metric', this.value)" placeholder="LOD / Metric" class="bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execAccent font-mono" />
                </div>
                <input value="${escapeAttr(proj.category)}" oninput="updateProj(${idx}, 'category', this.value)" placeholder="Category" class="w-full bg-execBg border border-execBorder rounded px-2 py-1.5 text-xs text-execSecondary" />

                <h2 class="text-[11px] font-mono font-bold uppercase tracking-widest text-execAccent border-b border-execBorder pb-1">Professional Experience</h2>
                <div class="space-y-3.5 mt-2">
                  ${visibleExp.map(ex => `
                    <div>
                      <div class="flex justify-between items-baseline">
                        <div class="text-sm font-bold text-execText">${escapeHtml(ex.role)} — <span class="font-normal text-execSecondary">${escapeHtml(ex.company)},${escapeHtml(ex.location)}</span></div>
                        <div class="text-xs font-mono text-execAccent font-semibold">${escapeHtml(ex.period)}</div>
                      </div>
                      <ul class="list-disc list-inside text-xs text-execText mt-1 space-y-0.5">
                        ${ex.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}

                </div>
              </div>

              <div class="mt-5">
                <h2 class="text-[11px] font-mono font-bold uppercase tracking-widest text-execAccent border-b border-execBorder pb-1">Selected International BIM Projects</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5 mt-2">
                  ${visibleProj.map(pr => `
                    <div class="border border-execBorder p-2.5 bg-execBg/30">
                      <div class="flex justify-between text-xs font-bold text-execText">
                        <span>${escapeHtml(pr.name)}</span>
                        <span class="text-execAccent font-mono">${escapeHtml(pr.metric)}</span>
                      </div>
                      <p class="text-[11px] text-execSecondary mt-0.5">${escapeHtml(pr.description)}</p>

                  `).join('')}
                </div>
              </div>

              <div class="mt-5 grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                  <h2 class="text-[11px] font-mono font-bold uppercase tracking-widest text-execAccent border-b border-execBorder pb-1">Core Technical Competencies</h2>
                  <div class="mt-1.5 space-y-1 text-xs text-execText">
                    ${state.skills.map(s => `<div><strong>${escapeHtml(s.category)}:</strong> <span class="text-execSecondary">${escapeHtml(s.items.join(', '))}</span></div>`).join('')}
                  </div>
                </div>
                <div>
                  <h2 class="text-[11px] font-mono font-bold uppercase tracking-widest text-execAccent border-b border-execBorder pb-1">Education, Awards & Certifications</h2>
                  <div class="mt-1.5 space-y-1 text-xs text-execText">
                    ${state.education.map(ed => `<div><strong>${escapeHtml(ed.degree)}</strong> — ${escapeHtml(ed.institution)} (${escapeHtml(ed.year)})</div>`).join('')}
                    <ul class="list-disc list-inside mt-1 space-y-0.5 text-[11px] text-execSecondary">
                      ${state.awardsAndCerts.map(c => `<li>${escapeHtml(c)}</li>`).join('')}

                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    // =========================================================================
    // 5. THREE.JS EXECUTIVE GOLD & CHARCOAL 3D BIM WIREFRAME
    // =========================================================================
    function initThreeScene() {
      const container = document.getElementById('three-canvas-container');
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.z = 6;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      const group = new THREE.Group();
      scene.add(group);

      // Outer Architectural Cage in Executive Gold (#B08D57)
      const geo1 = new THREE.BoxGeometry(2.7, 2.7, 2.7);
      const edges1 = new THREE.EdgesGeometry(geo1);
      const line1 = new THREE.LineSegments(edges1, new THREE.LineBasicMaterial({ color: 0xB08D57, transparent: true, opacity: 0.65 }));
      group.add(line1);

      // Inner BIM Coordination Core in Charcoal (#1D1D1B)
      const geo2 = new THREE.OctahedronGeometry(1.55, 1);
      const mat2 = new THREE.MeshBasicMaterial({ color: 0x1D1D1B, wireframe: true, transparent: true, opacity: 0.18 });
      const mesh2 = new THREE.Mesh(geo2, mat2);
      group.add(mesh2);

      group.position.x = 2.1;

      let animId;
      function animate() {
        animId = requestAnimationFrame(animate);
        line1.rotation.x += 0.0025;
        line1.rotation.y += 0.004;
        mesh2.rotation.x -= 0.003;
        mesh2.rotation.y -= 0.0025;
        renderer.render(scene, camera);
      }
      animate();

      const onResize = () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      };
      window.addEventListener('resize', onResize);

      threeCleanup = () => {
        cancelAnimationFrame(animId);
        window.removeEventListener('resize', onResize);
        renderer.dispose();
      };
    }

    // =========================================================================
    // 6. UTILITIES & INITIALIZATION
    // =========================================================================
    function downloadJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "resume.json";
      a.click();
      showToast('Downloaded resume.json');
    }

    function copyShareLink() {
      const url = new URL(window.location.href);
      url.searchParams.set('view', 'public');
      url.searchParams.set('template', currentTemplate);
      navigator.clipboard.writeText(url.toString());
      showToast('Copied clean share link: ?view=public&template=' + currentTemplate);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3200);
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function initPortfolio() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { state = JSON.parse(saved); } catch (e) {}
      }
      try {
        const response = await fetch('./resume.json?t=' + new Date().getTime());
        if (response.ok) {
          state = await response.json();
        }
      } catch (err) {}
      applyUrlParams();
      setAppMode(appMode);
      setTemplate(currentTemplate);
      renderEditor();
    }

    initPortfolio();
  </script>
